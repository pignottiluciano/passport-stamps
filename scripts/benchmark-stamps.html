<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Passport Stamps benchmark</title>
<style>
  body { font: 14px system-ui; margin: 24px; background: #faf8f3; }
  #stamps { display: grid; grid-template-columns: repeat(auto-fill, 96px); min-height: 72px; }
  pre { white-space: pre-wrap; }
</style>
<h1>Stamp loading and rendering benchmark</h1>
<p>Three runs per case. Cold modules use a fresh URL, then the same modules are reused for the warm run.</p>
<button id="run">Run benchmark</button>
<div id="stamps"></div>
<pre id="results" role="status"></pre>
<script type="module">
  const codes = __STAMP_CODES__;
  const results = document.querySelector('#results');
  const stamps = document.querySelector('#stamps');
  const nextPaint = () => new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  const median = values => values.sort((a, b) => a - b)[Math.floor(values.length / 2)];

  async function measure(prefix, count, variant, date) {
    stamps.replaceChildren();
    performance.clearResourceTimings();
    const start = performance.now();
    const { createStampImage } = await import(prefix + '/index.js');
    const images = await Promise.all(codes.slice(0, count).map(async country => {
      const stamp = await createStampImage({ country, variant, date });
      const image = new Image(96, 72);
      image.src = stamp.src;
      return image;
    }));
    stamps.append(...images);
    await Promise.all(images.map(image => image.decode()));
    await nextPaint();
    const elapsed = performance.now() - start;
    const modules = performance.getEntriesByType('resource').filter(entry => entry.name.includes(prefix + '/'));
    return {
      ms: elapsed,
      bytes: modules.reduce((total, entry) => total + entry.encodedBodySize, 0),
      transfer: modules.reduce((total, entry) => total + entry.transferSize, 0),
      initial: modules.filter(entry => !entry.name.includes('/art/')).reduce((total, entry) => total + entry.encodedBodySize, 0)
    };
  }

  document.querySelector('#run').addEventListener('click', async event => {
    const button = event.currentTarget;
    button.disabled = true;
    const report = [];
    let run = Date.now();
    try {
      for (const count of [1, 50]) for (const variant of ['worn', 'clean']) for (const dated of [false, true]) {
        for (const build of ['current']) {
          const cold = [], warm = [];
          for (let repeat = 0; repeat < 3; repeat++) {
            results.textContent = `Measuring ${build}, ${count} images, ${variant}, ${dated ? 'dated' : 'undated'} (${repeat + 1}/3)…`;
            const prefix = `/run/${run++}/${build}`;
            const date = dated ? '2026-11-07' : undefined;
            cold.push(await measure(prefix, count, variant, date));
            warm.push(await measure(prefix, count, variant, date));
          }
          const summary = runs => Object.fromEntries(Object.keys(runs[0]).map(key => [key, Math.round(median(runs.map(run => run[key])) * 10) / 10]));
          report.push({ build, count, variant, dated, cold: summary(cold), warm: summary(warm) });
        }
      }
      results.textContent = 'Complete\n' + JSON.stringify({ browser: navigator.userAgent, cases: report }, null, 2);
    } catch (error) {
      results.textContent = 'Failed: ' + error.message;
    } finally {
      button.disabled = false;
    }
  });
</script>
</html>
