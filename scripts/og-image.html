<!doctype html><meta charset="utf-8"><style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#FAF8F3;color:#292823;font-family:'Avenir Next','Segoe UI',Arial,sans-serif}
.wrap{display:grid;grid-template-columns:520px 1fr;height:100%;align-items:center;padding:0 60px;box-sizing:border-box;gap:20px}
h1{font:400 76px/1.05 'Iowan Old Style',Palatino,serif;letter-spacing:-2px;margin:0 0 22px}
p{font-size:24px;color:#746E63;margin:0 0 30px;line-height:1.4}
.brand{font-size:22px;font-weight:650;display:flex;align-items:center;gap:12px}
.mark{width:34px;height:34px;border:1.5px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:19px}
.sheet{position:relative;height:560px}
.sheet img{position:absolute;width:370px}
.a{left:10px;top:25px;transform:rotate(-6deg)}.b{left:165px;top:165px;transform:rotate(4deg)}.c{left:-60px;top:290px;transform:rotate(-2deg)}
</style><div class="wrap"><div><div class="brand"><span class="mark">p</span>Passport Stamps</div><h1 style="margin-top:34px">Keep a little of every place.</h1><p>193 countries · 238 destinations<br>Free SVG stamps · MIT licensed</p></div>
<div class="sheet"><img class="a" src="../svg/fr-paris.svg"><img class="b" src="../preview/hero-mendoza.svg"><img class="c" src="../svg/jp.svg"></div></div>
